name: Générer la newsletter quotidienne

on:
  schedule:
    - cron: '30 4 * * *'  # Tous les jours à 4h30 UTC = 00:30 heure Guadeloupe (après les horoscopes)
  workflow_dispatch:
    inputs:
      force_send:
        description: 'Renvoyer la campagne du jour même si déjà générée'
        type: boolean
        default: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Configurer SSH pour le sous-module privé
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SUBMODULE_DEPLOY_KEY }}

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm install

      - name: 🔑 Préflight Mistral (clé / quota)
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: npx tsx scripts/check-mistral.ts

      - name: Générer et envoyer la newsletter
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_LIST_ID: ${{ secrets.BREVO_LIST_ID }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          NEXT_PUBLIC_BASE_URL: https://zodyak-karukera.com
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: npx tsx scripts/generate-daily-newsletter.ts ${{ inputs.force_send == true && '--force-send' || '' }}

      - name: 🚨 Alerte en cas d'échec
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          brevo_api_key: ${{ secrets.BREVO_API_KEY }}
          email_from: ${{ secrets.EMAIL_FROM }}
          alert_email: ${{ secrets.ALERT_EMAIL }}
