name: Régénérer les dimensions spirituelles mensuelles

on:
  schedule:
    - cron: '0 5 1 * *'   # 1er du mois à 5h UTC (1h Guadeloupe)
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Configurer SSH pour le sous-module privé
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SUBMODULE_DEPLOY_KEY }}

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: 🔑 Préflight Mistral (clé / quota)
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: npx tsx scripts/check-mistral.ts

      - name: Générer les dimensions spirituelles via Mistral
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: npx tsx scripts/generate-spirituel.ts

      - name: Commit et push si le fichier a changé
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add public/data/spirituels/
          git diff --staged --quiet || git commit -m "chore: dimension spirituelle mensuelle ($(date +%Y-%m)) [skip netlify]"
          git push --force-with-lease origin vaudou

      - name: 🚨 Alerte en cas d'échec
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          brevo_api_key: ${{ secrets.BREVO_API_KEY }}
          email_from: ${{ secrets.EMAIL_FROM }}
          alert_email: ${{ secrets.ALERT_EMAIL }}
