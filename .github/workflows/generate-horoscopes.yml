name: Générer les horoscopes quotidiens

on:
  schedule:
    - cron: '0 4 * * *'   # Tous les jours à 4h UTC = minuit heure Guadeloupe (UTC-4)
  workflow_dispatch:
    inputs:
      force:
        description: 'Forcer la régénération même si les fichiers existent'
        required: false
        default: 'false'
      verbose:
        description: 'Mode verbeux (plus de logs)'
        required: false
        default: 'false'

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Configurer SSH pour le sous-module privé
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SUBMODULE_DEPLOY_KEY }}

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm install

      - name: Générer les horoscopes
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: |
          ARGS=""
          if [ "${{ inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
          if [ "${{ inputs.verbose }}" = "true" ]; then ARGS="$ARGS --verbose"; fi
          npx tsx scripts/generate-horoscopes.ts $ARGS

      - name: Commit les horoscopes générés
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git checkout main
          git fetch origin
          git reset --hard origin/main
          git add data/horoscopes/*.json
          git diff --staged --quiet || git commit -m "chore: génération quotidienne horoscopes ($(date +%Y-%m-%d))"
          git push --force-with-lease origin main
