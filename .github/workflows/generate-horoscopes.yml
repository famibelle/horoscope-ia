name: Générer les horoscopes et ambiances quotidiens

on:
  schedule:
    - cron: '0 4 * * *'   # Tous les jours à 4h UTC = minuit heure Guadeloupe (UTC-4)
  workflow_dispatch:
    inputs:
      mode:
        description: 'Mode de génération'
        required: false
        default: 'normal'
        type: choice
        options:
        - normal
        - verbose
        - force
        - force-verbose

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Configurer SSH pour le sous-module privé
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SUBMODULE_DEPLOY_KEY }}

      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm install

      - name: Générer les horoscopes
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: |
          ARGS=""
          case "${{ inputs.mode }}" in
            verbose)   ARGS="--verbose" ;;
            force)     ARGS="--force" ;;
            force-verbose) ARGS="--force --verbose" ;;
          esac
          npx tsx scripts/generate-horoscopes.ts $ARGS

      - name: Générer les ambiances
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: |
          ARGS=""
          case "${{ inputs.mode }}" in
            verbose)   ARGS="--verbose" ;;
            force)     ARGS="--force" ;;
            force-verbose) ARGS="--force --verbose" ;;
          esac
          npx tsx scripts/generate-ambiances.ts $ARGS

      - name: Générer le signe du jour
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: |
          ARGS=""
          case "${{ inputs.mode }}" in
            verbose)   ARGS="--verbose" ;;
            force)     ARGS="--force" ;;
            force-verbose) ARGS="--force --verbose" ;;
          esac
          npx tsx scripts/generate-signe-du-jour.ts $ARGS

      - name: Commit les données générées
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add public/data/horoscopes/*.json public/data/ambiance/*.json public/data/signe-du-jour/*.json
          git diff --staged --quiet || git commit -m "chore: génération quotidienne horoscopes, ambiances et signe du jour ($(date +%Y-%m-%d))"
          git push origin vaudou
