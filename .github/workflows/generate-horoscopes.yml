name: 🪐 Génération Horoscopes (Sécurisée)

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Date (YYYY-MM-DD)'
        required: false
      mode:
        description: 'Mode'
        required: false
        default: 'normal'
        type: choice
        options: [normal, verbose, force]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: 🛡️ Audit de Sécurité & Préparation
        run: |
          if [ "${{ github.ref_name }}" != "vaudou" ]; then
            echo "❌ ERREUR: Branche vaudou requise."
            exit 1
          fi
          if [ -z "${{ secrets.MISTRAL_API_KEY }}" ]; then
            echo "❌ ERREUR: Clé API manquante."
            exit 1
          fi

      - name: Configurer SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SUBMODULE_DEPLOY_KEY }}

      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Installation Dépendances
        run: |
          npm ci || npm install
          sudo apt-get install -y jq

      - name: 🚀 Génération des Horoscopes
        id: generate
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          DATE_ARG=""
          if [ -n "${{ github.event.inputs.date }}" ]; then
            DATE_ARG="--date=${{ github.event.inputs.date }}"
          fi
          
          MODE_ARG=""
          if [ "${{ github.event.inputs.mode }}" == "force" ]; then
            MODE_ARG="--force"
          elif [ "${{ github.event.inputs.mode }}" == "verbose" ]; then
            MODE_ARG="--verbose"
          fi

          npx tsx scripts/generate-horoscopes.ts $DATE_ARG $MODE_ARG

      - name: 📊 Artefacts & Logs
        if: always()
        run: |
          mkdir -p artifacts
          cp -r logs/* artifacts/ 2>/dev/null || true
          cp -r lib/private/logs/* artifacts/ 2>/dev/null || true
          {
            echo "# Rapport Horoscopes"
            echo "Status: ${{ steps.generate.outcome }}"
          } > artifacts/HORO_REPORT.md

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: horoscopes-execution-report
          path: artifacts/

      - name: ✅ Vérification Supabase
        if: success()
        run: echo "✅ Horoscopes écrits dans Supabase — pas de commit git nécessaire."
