name: 🪐 Génération Horoscopes (Sécurisée)

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Date (YYYY-MM-DD)'
        required: false
      mode:
        description: 'Mode'
        required: false
        default: 'normal'
        type: choice
        options: [normal, verbose, force]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: 🛡️ Audit de Sécurité & Préparation
        run: |
          echo "🔍 Vérification de la branche..."
          if [ "${{ github.ref_name }}" != "vaudou" ]; then
            echo "❌ ERREUR: Ce workflow ne doit s'exécuter que sur la branche 'vaudou'."
            exit 1
          fi
          
          echo "🔑 Vérification des secrets..."
          if [ -z "${{ secrets.MISTRAL_API_KEY }}" ]; then
            echo "❌ ERREUR: MISTRAL_API_KEY manquant. Fin du workflow pour éviter des frais inutiles."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Installation Dépendances
        run: |
          npm ci || npm install
          sudo apt-get install -y jq

      - name: 🧪 Test de Connexion LLM (Dry-Run)
        run: |
          echo "📡 Test de l'API Mistral..."
          RESPONSE=$(curl -s -X GET "https://api.mistral.ai/v1/models" \
            -H "Authorization: Bearer ${{ secrets.MISTRAL_API_KEY }}")
          if ! echo "$RESPONSE" | grep -q "mistral-large"; then
            echo "❌ Échec de connexion à l'API Mistral."
            exit 1
          fi
          echo "✅ Connexion OK."

      - name: 🧪 Test de l'Infrastructure Git
        run: |
          echo "📝 Test d'écriture Git..."
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          touch git-test.tmp
          git add git-test.tmp
          git commit -m "test: infrastructure git"
          git push origin vaudou
          git rm git-test.tmp
          git commit -m "test: cleanup infrastructure"
          git push origin vaudou
          echo "✅ Infrastructure Git OK."

      - name: 🚀 Génération des Horoscopes
        id: generate
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: |
          DATE_ARG=""
          if [ -n "${{ github.event.inputs.date }}" ]; then
            DATE_ARG="--date=${{ github.event.inputs.date }}"
          fi
          
          MODE_ARG=""
          if [ "${{ github.event.inputs.mode }}" == "force" ]; then
            MODE_ARG="--force"
          elif [ "${{ github.event.inputs.mode }}" == "verbose" ]; then
            MODE_ARG="--verbose"
          fi

          echo "🎬 Lancement de la génération..."
          npx tsx scripts/generate-horoscopes.ts $DATE_ARG $MODE_ARG

      - name: 📊 Collecte des Artefacts & Logs
        if: always()
        run: |
          mkdir -p artifacts
          cp -r logs/* artifacts/ 2>/dev/null || true
          
          # Création d'une note détaillée
          {
            echo "# Rapport d'Exécution"
            echo "Date: $(date)"
            echo "Branche: ${{ github.ref_name }}"
            echo "Status Génération: ${{ steps.generate.outcome }}"
            echo "---"
            if [ -d "logs" ]; then
              ls -la logs/
            fi
          } > artifacts/EXECUTION_REPORT.md

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: horoscopes-execution-report
          path: artifacts/

      - name: 💾 Commit & Push des résultats
        if: success()
        run: |
          git add public/data/horoscopes/*.json
          if ! git diff --staged --quiet; then
            git commit -m "chore: mise à jour horoscopes $(date +%Y-%m-%d)"
            git push origin vaudou
          else
            echo "Aucun changement à committer."
          fi
