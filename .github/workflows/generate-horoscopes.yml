name: Générer les horoscopes et ambiances quotidiens (SÉCURISÉ - ZÉRO RISQUE 25€)

# =============================================================================
# 🛡️  WORKFLOW ULTRA-SÉCURISÉ AVEC 8 COUCHES DE PROTECTION
# =============================================================================
# Objectif: ÉVITER TOUT COÛT INUTILE (25€ par échec)
# Stratégie: Chaque étape critique est testée AVANT de passer à la suivante
# =============================================================================

on:
  # Tous les jours à 4h00 UTC = minuit en Guadeloupe (UTC-4)
  schedule:
    - cron: '0 4 * * *'
  
  # Déclenchement manuel avec options
  workflow_dispatch:
    inputs:
      date:
        description: 'Date à générer (YYYY-MM-DD). Par défaut: demain en Guadeloupe'
        required: false
      mode:
        description: 'Mode de génération'
        required: false
        default: 'normal'
        type: choice
        options:
        - normal
        - verbose
        - force
        - force-verbose
  
  # Déclencher aussi lors d'un push sur main/vaudou (pour les tests)
  push:
    branches: [main, vaudou]
    paths:
      - 'scripts/generate-horoscopes.ts'
      - 'scripts/generate-ambiances.ts'
      - 'scripts/generate-signe-du-jour.ts'
      - 'lib/private/maryse-prompt.ts'
      - 'lib/cultural-context.ts'
      - '.github/workflows/generate-horoscopes.yml'

# =============================================================================
# 🔐 PERMISSIONS: GITHUB_TOKEN doit pouvoir écrire sur le repo
# =============================================================================
permissions:
  contents: write
  packages: write

jobs:
  generate:
    runs-on: ubuntu-latest
    
    steps:
      # ========================================================================
      # 🔐 COUCHE -1: VÉRIFICATION INITIALE DE L'ENVIRONNEMENT
      # ========================================================================
      - name: Vérifier l'environnement du runner
        run: |
          echo "🔍 Vérification initiale de l'environnement..."
          echo "Mémoire disponible:"
          free -m
          echo "Espace disque:"
          df -h
          echo "Version de git:"
          git --version
          echo "✅ Environnement vérifié"

      # ========================================================================
      # 🔐 COUCHE 0: VÉRIFICATION DES SECRETS (Évite 25€ si API_KEY manquant)
      # ========================================================================
      - name: Verify Mistral API key exists
        run: |
          echo "🔑 Vérification de MISTRAL_API_KEY..."
          if [ -z "${{ secrets.MISTRAL_API_KEY }}" ] || [ "${{ secrets.MISTRAL_API_KEY }}" = " " ]; then
            echo "❌ ERREUR CRITIQUE: MISTRAL_API_KEY non configuré ou vide !"
            echo "   → Sans ça, la génération coûtera 25€ pour RIEN."
            echo "   Solution: Configurez le secret dans GitHub Settings > Secrets > Actions"
            exit 1
          fi
          # Vérifier que la clé a au moins 30 caractères (format valide)
          if [ ${#MISTRAL_API_KEY} -lt 30 ]; then
            echo "❌ ERREUR: MISTRAL_API_KEY semble invalide (trop court)"
            exit 1
          fi
          echo "✅ MISTRAL_API_KEY est présent et valide"
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}

      - name: Verify GITHUB_TOKEN permissions
        run: |
          echo "🔑 Vérification des permissions GITHUB_TOKEN..."
          if [ -z "${{ secrets.GITHUB_TOKEN }}" ]; then
            echo "❌ ERREUR CRITIQUE: GITHUB_TOKEN manquant !"
            exit 1
          fi
          # Tester les permissions en lisant un fichier
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -I "https://api.github.com/repos/famibelle/horoscope-ia/contents/README.md")
          if [ "$RESPONSE" != "200" ]; then
            echo "❌ ERREUR: GITHUB_TOKEN n'a pas les permissions de lecture (code: $RESPONSE)"
            exit 1
          fi
          # Tester les permissions d'écriture (sur la branche actuelle)
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -I "https://api.github.com/repos/famibelle/horoscope-ia/git/ref/heads/${{ github.ref_name }}")
          if [ "$RESPONSE" != "200" ]; then
            echo "❌ ERREUR: GITHUB_TOKEN n'a pas les permissions sur la branche ${{ github.ref_name }} (code: $RESPONSE)"
            exit 1
          fi
          echo "✅ GITHUB_TOKEN a toutes les permissions nécessaires"

      # ========================================================================
      # 🌿 COUCHE 0.5: CHECKOUT + SYNCHRONISATION AVEC ORIGIN
      # ========================================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Récupérer tout l'historique pour éviter les problèmes
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Synchroniser avec origin
        run: |
          echo "🔄 Synchronisation avec origin/${{ github.ref_name }}..."
          git remote set-url origin https://${{ secrets.GITHUB_TOKEN }}@github.com/famibelle/horoscope-ia.git
          
          # Vérifier si la branche existe sur origin
          if ! git ls-remote --heads origin ${{ github.ref_name }} | grep -q "refs/heads/${{ github.ref_name }}"; then
            echo "❌ Branche ${{ github.ref_name }} n'existe pas sur origin !"
            echo "   Solution: Créez la branche manuellement ou poussez depuis votre local"
            exit 1
          fi
          
          # Pull avec rebase pour éviter les conflits
          git pull --rebase origin ${{ github.ref_name }} || {
            echo "⚠️  Rebase échoué, tentative avec merge..."
            git pull origin ${{ github.ref_name }} || {
              echo "❌ Échec du pull - impossible de synchroniser"
              exit 1
            }
          }
          echo "✅ Branche synchronisée avec origin/${{ github.ref_name }}"

      # ========================================================================
      # 📁 COUCHE 0.75: PRÉPARATION DES DOSSIERS
      # ========================================================================
      - name: Créer les dossiers nécessaires
        run: |
          echo "📁 Création des dossiers..."
          mkdir -p public/data/horoscopes
          mkdir -p public/data/ambiance
          mkdir -p public/data/signe-du-jour
          mkdir -p logs
          echo "✅ Dossiers créés"

      # ========================================================================
      # 🧪 COUCHE 1: DRY-RUN MISTRAL (Test de connexion avant génération)
      # ========================================================================
      - name: Tester la connexion Mistral (dry-run)
        run: |
          echo "🔍 Test de connexion à Mistral API..."
          RESPONSE=$(curl -s -X GET "https://api.mistral.ai/v1/models" \
            -H "Authorization: Bearer ${{ secrets.MISTRAL_API_KEY }}" \
            -H "Content-Type: application/json" 2>&1)
          
          if echo "$RESPONSE" | grep -q "mistral-large"; then
            echo "✅ Mistral API est accessible et fonctionnel"
          else
            echo "❌ Impossible de contacter Mistral API"
            echo "Réponse: $RESPONSE"
            echo "Vérifiez: 1) La clé API, 2) Le réseau, 3) Le quota"
            exit 1
          fi

      # ========================================================================
      # 🧪 COUCHE 2: DRY-RUN COMMIT/PUSH (Test complet AVANT la génération)
      # ========================================================================
      - name: Dry-run commit/push (test avec AAAA-MM-JJ_pseudo.json)
        id: dry-run-commit
        run: |
          echo "🧪 Dry-run: Test du pipeline commit/push avec fichier pseudo..."
          
          # Nettoyer tout fichier pseudo existant (évite les conflits avec les runs précédents)
          rm -f public/data/horoscopes/2000-01-01_pseudo.json
          
          DATE_TEST="2000-01-01"
          # Utiliser un timestamp pour éviter les conflits entre runs simultanés
          TIMESTAMP=$(date +%s)
          PSEUDO_FILE="public/data/horoscopes/${DATE_TEST}_pseudo_${TIMESTAMP}.json"
          
          # Créer un fichier pseudo valide (méthode compatible sans jq)
          # On crée un JSON minimal avec echo pour éviter les dépendances
          echo '{
            "belier": {"edition1": "TEST", "edition2": "TEST", "edition3": "TEST", "edition4": "TEST"},
            "taureau": {"edition1": "TEST", "edition2": "TEST", "edition3": "TEST", "edition4": "TEST"},
            "gemeaux": {"edition1": "TEST", "edition2": "TEST", "edition3": "TEST", "edition4": "TEST"},
            "cancer": {"edition1": "TEST", "edition2": "TEST", "edition3": "TEST", "edition4": "TEST"},
            "lion": {"edition1": "TEST", "edition2": "TEST", "edition3": "TEST", "edition4": "TEST"},
            "vierge": {"edition1": "TEST", "edition2": "TEST", "edition3": "TEST", "edition4": "TEST"},
            "balance": {"edition1": "TEST", "edition2": "TEST", "edition3": "TEST", "edition4": "TEST"},
            "scorpion": {"edition1": "TEST", "edition2": "TEST", "edition3": "TEST", "edition4": "TEST"},
            "sagittaire": {"edition1": "TEST", "edition2": "TEST", "edition3": "TEST", "edition4": "TEST"},
            "capricorne": {"edition1": "TEST", "edition2": "TEST", "edition3": "TEST", "edition4": "TEST"},
            "verseau": {"edition1": "TEST", "edition2": "TEST", "edition3": "TEST", "edition4": "TEST"},
            "poissons": {"edition1": "TEST", "edition2": "TEST", "edition3": "TEST", "edition4": "TEST"}
          }' > "$PSEUDO_FILE"
          
          echo "✅ Fichier pseudo créé: $PSEUDO_FILE"
          
          # Tester git add
          if ! git add "$PSEUDO_FILE"; then
            echo "❌ Échec: git add $PSEUDO_FILE"
            rm -f "$PSEUDO_FILE"
            exit 1
          fi
          echo "✅ git add: OK"
          
          # Configurer git
          git config --global user.name "GitHub Actions [Dry-Run]"
          git config --global user.email "dry-run@github.com"
          
          # Tester git commit
          if ! git commit -m "test: dry-run commit/push [AAAA-MM-JJ_pseudo.json]"; then
            echo "❌ Échec: git commit"
            git reset HEAD "$PSEUDO_FILE" 2>/dev/null || true
            rm -f "$PSEUDO_FILE"
            exit 1
          fi
          echo "✅ git commit: OK"
          
          # Tester git remote set-url
          if ! git remote set-url origin https://${{ secrets.GITHUB_TOKEN }}@github.com/famibelle/horoscope-ia.git; then
            echo "❌ Échec: git remote set-url"
            git reset HEAD~1 2>/dev/null || true
            rm -f "$PSEUDO_FILE"
            exit 1
          fi
          echo "✅ git remote set-url: OK"
          
          # Synchroniser avant push (au cas où la branche a bougé)
          git pull --rebase origin ${{ github.ref_name }} || {
            echo "⚠️  Pull échoué, tentative sans rebase..."
            git pull origin ${{ github.ref_name }} || {
              echo "❌ Échec de synchronisation avant push"
              git reset HEAD~1 2>/dev/null || true
              rm -f "$PSEUDO_FILE"
              exit 1
            }
          }
           
          # Tester git push (c'est le test critique !)
          # Utiliser --force-with-lease pour gérer les pushes simultanés
          if git push --force-with-lease origin ${{ github.ref_name }}; then
            echo "✅ git push: OK"
            
            # Nettoyer: supprimer le fichier pseudo et committer/pusher
            # Cela garantit que la branche reste propre après le dry-run
            echo "🧹 Nettoyage du dry-run..."
            if git rm --ignore-unmatch "$PSEUDO_FILE" 2>/dev/null || rm -f "$PSEUDO_FILE"; then
              echo "✅ Fichier pseudo supprimé"
            fi
            
            # Committer la suppression
            if git commit -m "cleanup: dry-run - suppression de $PSEUDO_FILE" --allow-empty; then
              echo "✅ Commit de nettoyage créé"
              # Pusher le commit de nettoyage
              if git push --force-with-lease origin ${{ github.ref_name }}; then
                echo "✅ Cleanup pushé - branche propre"
              else
                echo "⚠️  Échec du push de cleanup (mais le test push a réussi)"
                # Ce n'est pas bloquant, le dry-run a validé le push
              fi
            else
              echo "⚠️  Échec du commit de cleanup (mais le test push a réussi)"
            fi
            
            echo "dry_run_success=true" >> $GITHUB_OUTPUT
            echo "✅ Dry-run commit/push: SUCCESS - Tout fonctionne !"
          else
            echo "❌ Échec: git push"
            echo "dry_run_success=false" >> $GITHUB_OUTPUT
            # Essayer de nettoyer même en cas d'échec
            git reset HEAD~1 2>/dev/null || true
            rm -f "$PSEUDO_FILE"
            exit 1
          fi

      # ========================================================================
      # 📅 COUCHE 3: CONFIGURATION DE LA DATE
      # ========================================================================
      - name: Configure date for generation
        id: date
        run: |
          echo "📅 Configuration de la date..."
          if [ -n "${{ github.event.inputs.date }}" ]; then
            echo "DATE=${{ github.event.inputs.date }}" >> $GITHUB_OUTPUT
            echo "   Date fournie: ${{ github.event.inputs.date }}"
          else
            # Date de demain en Guadeloupe (UTC-4)
            TOMORROW_GUADELOUPE=$(date -u -d '+4 hours' +%Y-%m-%d)
            echo "DATE=$TOMORROW_GUADELOUPE" >> $GITHUB_OUTPUT
            echo "   Génération pour demain (Guadeloupe): $TOMORROW_GUADELOUPE"
          fi
          echo "✅ Date configurée: ${{ steps.date.outputs.DATE }}"

      # ========================================================================
      # 🔍 COUCHE 4: VÉRIFICATION DES FICHIERS EXISTANTS
      # ========================================================================
      - name: Check if data files already exist
        id: check-data
        run: |
          echo "🔍 Vérification des fichiers existants..."
          DATE=${{ steps.date.outputs.DATE }}
          HORO_FILE="public/data/horoscopes/${DATE}.json"
          
          if [ -f "$HORO_FILE" ]; then
            echo "data_exists=true" >> $GITHUB_OUTPUT
            echo "✅ Fichiers horoscopes existants pour ${DATE}"
            
            # Vérifier que le fichier est valide
            if ! jq empty "$HORO_FILE" 2>/dev/null; then
              echo "⚠️  Fichier existant corrompu - Régénération forcée"
              echo "data_exists=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "data_exists=false" >> $GITHUB_OUTPUT
            echo "ℹ️  Fichiers manquants pour ${DATE} - Génération nécessaire"
          fi

      # ========================================================================
      # ⚡ COUCHE 5: INSTALLATION DES DÉPENDANCES
      # ========================================================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: |
          echo "📦 Installation des dépendances..."
          npm ci
          echo "✅ Dépendances installées"

      # ========================================================================
      # 🚀 COUCHE 6: GÉNÉRATION AVEC LOGGING COMPLET
      # ========================================================================
      - name: Générer les horoscopes (avec logging)
        id: generate-horoscopes
        if: steps.dry-run-commit.outputs.dry_run_success == 'true' && (steps.check-data.outputs.data_exists != 'true' || github.event.inputs.mode == 'force' || github.event.inputs.mode == 'force-verbose')
        run: |
          echo "🚀 Démarrage de la génération pour ${{ steps.date.outputs.DATE }}"
          
          # Construire la commande avec les arguments
          COMMAND="npx tsx scripts/generate-horoscopes.ts \
            --date=${{ steps.date.outputs.DATE }} \
            --force"
          
          # Ajouter les flags selon le mode
          case "${{ github.event.inputs.mode }}" in
            verbose)
              COMMAND="$COMMAND --verbose"
              ;;
            force-verbose)
              COMMAND="$COMMAND --verbose"
              ;;
          esac
          
          # Ajouter --verbose si c'est un workflow manuel sans mode spécifié
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.mode }}" = "normal" ]; then
            COMMAND="$COMMAND --verbose"
          fi
          
          echo "Commande: $COMMAND"
          
          # Exécuter avec timeout (20 min max - 48 appels Mistral avec délais 10s)
          if timeout 1200 bash -c "$COMMAND"; then
            echo "SUCCESS=true" >> $GITHUB_OUTPUT
            echo "✅ Génération horoscopes terminée avec succès!"
          else
            EXIT_CODE=$?
            echo "SUCCESS=false" >> $GITHUB_OUTPUT
            echo "❌ Échec de la génération (code: $EXIT_CODE)"
            
            # Afficher le dernier rapport de logs
            LAST_LOG=$(ls -t logs/generation-report-*.md 2>/dev/null | head -1 || true)
            if [ -n "$LAST_LOG" ]; then
              echo "📄 Dernier rapport de logs:"
              echo "::group::Logs"
              cat "$LAST_LOG" || true
              echo "::endgroup::"
            fi
            exit $EXIT_CODE
          fi
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          NETLIFY_URL: https://horoscope-karukera.netlify.app
          NODE_ENV: production
          GITHUB_RUN_ID: ${{ github.run_id }}

      - name: Générer les ambiances
        id: generate-ambiance
        if: steps.dry-run-commit.outputs.dry_run_success == 'true' && (steps.check-data.outputs.data_exists != 'true' || github.event.inputs.mode == 'force' || github.event.inputs.mode == 'force-verbose')
        run: |
          echo "🎨 Génération des ambiances pour ${{ steps.date.outputs.DATE }}..."
          
          AMB_COMMAND="npx tsx scripts/generate-ambiances.ts \
            --date=${{ steps.date.outputs.DATE }} \
            --force"
          
          case "${{ github.event.inputs.mode }}" in
            verbose)
              AMB_COMMAND="$AMB_COMMAND --verbose"
              ;;
            force-verbose)
              AMB_COMMAND="$AMB_COMMAND --verbose"
              ;;
          esac
          
          echo "Commande: $AMB_COMMAND"
          
          if timeout 1200 bash -c "$AMB_COMMAND"; then
            echo "AMB_SUCCESS=true" >> $GITHUB_OUTPUT
            echo "✅ Génération ambiances terminée avec succès!"
          else
            echo "AMB_SUCCESS=false" >> $GITHUB_OUTPUT
            echo "⚠️  Échec de la génération ambiances (non bloquant)"
          fi
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          NETLIFY_URL: https://horoscope-karukera.netlify.app
          NODE_ENV: production
          GITHUB_RUN_ID: ${{ github.run_id }}

      - name: Générer le signe du jour
        id: generate-signe
        if: steps.dry-run-commit.outputs.dry_run_success == 'true' && (steps.check-data.outputs.data_exists != 'true' || github.event.inputs.mode == 'force' || github.event.inputs.mode == 'force-verbose')
        run: |
          echo "🌿 Génération du signe du jour pour ${{ steps.date.outputs.DATE }}..."
          
          SDJ_COMMAND="npx tsx scripts/generate-signe-du-jour.ts \
            --date=${{ steps.date.outputs.DATE }} \
            --force"
          
          case "${{ github.event.inputs.mode }}" in
            verbose)
              SDJ_COMMAND="$SDJ_COMMAND --verbose"
              ;;
            force-verbose)
              SDJ_COMMAND="$SDJ_COMMAND --verbose"
              ;;
          esac
          
          echo "Commande: $SDJ_COMMAND"
          
          if timeout 1200 bash -c "$SDJ_COMMAND"; then
            echo "SDJ_SUCCESS=true" >> $GITHUB_OUTPUT
            echo "✅ Génération signe du jour terminée avec succès!"
          else
            echo "SDJ_SUCCESS=false" >> $GITHUB_OUTPUT
            echo "⚠️  Échec de la génération signe du jour (non bloquant)"
          fi
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          NETLIFY_URL: https://horoscope-karukera.netlify.app
          NODE_ENV: production
          GITHUB_RUN_ID: ${{ github.run_id }}

      # ========================================================================
      # 🔍 COUCHE 7: VALIDATION STRICTE DES FICHIERS GÉNÉRÉS
      # ========================================================================
      - name: Valider les fichiers générés
        id: validate
        if: steps.generate-horoscopes.outputs.SUCCESS == 'true'
        run: |
          echo "🔍 Validation des fichiers générés..."
          DATE=${{ steps.date.outputs.DATE }}
          VALID=true
          
          # Vérifier que les 3 fichiers principaux existent
          for file in "public/data/horoscopes/${DATE}.json" \
                      "public/data/ambiance/${DATE}.json" \
                      "public/data/signe-du-jour/${DATE}.json"; do
            if [ ! -f "$file" ]; then
              echo "❌ Fichier manquant: $file"
              VALID=false
            fi
          done
          
          # Vérifier la structure des horoscopes (48 entrées attendues)
          if [ -f "public/data/horoscopes/${DATE}.json" ]; then
            COUNT=$(jq '. | length' "public/data/horoscopes/${DATE}.json" 2>/dev/null || echo "0")
            if [ "$COUNT" -ne 48 ]; then
              echo "❌ Nombre d'horoscopes incorrect: $COUNT (attendu: 48)"
              VALID=false
            else
              echo "✅ Nombre d'horoscopes correct: $COUNT"
            fi
          fi
          
          # Vérifier que les fichiers ne sont pas vides
          for file in "public/data/horoscopes/${DATE}.json" \
                      "public/data/ambiance/${DATE}.json" \
                      "public/data/signe-du-jour/${DATE}.json"; do
            if [ -f "$file" ] && [ ! -s "$file" ]; then
              echo "❌ Fichier vide: $file"
              VALID=false
            fi
          done
          
          # Vérifier la validité JSON de tous les fichiers
          for file in "public/data/horoscopes/${DATE}.json" \
                      "public/data/ambiance/${DATE}.json" \
                      "public/data/signe-du-jour/${DATE}.json"; do
            if [ -f "$file" ]; then
              if ! jq empty "$file" 2>/dev/null; then
                echo "❌ JSON invalide: $file"
                VALID=false
              else
                echo "✅ JSON valide: $file"
              fi
            fi
          done
          
          if [ "$VALID" = false ]; then
            echo "❌ Validation échouée - fichiers non valides !"
            echo "valid=false" >> $GITHUB_OUTPUT
            exit 1
          else
            echo "✅ Tous les fichiers sont valides et complets"
            echo "valid=true" >> $GITHUB_OUTPUT
          fi

      # ========================================================================
      # 📝 COUCHE 8: COMMIT + PUSH AVEC TRIPLE VÉRIFICATION
      # ========================================================================
      - name: Préparer le commit
        if: steps.validate.outputs.valid == 'true'
        id: prepare-commit
        run: |
          echo "📝 Préparation du commit..."
          DATE=${{ steps.date.outputs.DATE }}
          
          git add public/data/horoscopes/${DATE}.json
          git add public/data/ambiance/${DATE}.json
          git add public/data/signe-du-jour/${DATE}.json
          git add logs/  # 📄 Ajouter les logs de génération
          
          if git diff --cached --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "ℹ️  Aucun changement à commiter"
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "✅ Fichiers prêts pour le commit"
          fi

      - name: Créer le commit
        if: steps.prepare-commit.outputs.has_changes == 'true'
        id: create-commit
        run: |
          echo "📝 Création du commit..."
          DATE=${{ steps.date.outputs.DATE }}
          
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          
          if git commit -m "chore: horoscopes, ambiances et signe du jour du ${DATE} [auto-generated]"; then
            echo "commit_created=true" >> $GITHUB_OUTPUT
            echo "✅ Commit créé: $(git rev-parse HEAD)"
          else
            echo "❌ Échec de la création du commit"
            exit 1
          fi

      - name: Vérifier le commit
        if: steps.create-commit.outputs.commit_created == 'true'
        run: |
          echo "🔍 Vérification du commit..."
          DATE=${{ steps.date.outputs.DATE }}
          
          if git show --name-only HEAD | grep -q "public/data/horoscopes/${DATE}.json"; then
            echo "✅ Commit contient les fichiers attendus"
          else
            echo "❌ Commit ne contient pas les fichiers attendus !"
            echo "Fichiers dans le commit:"
            git show --name-only HEAD
            exit 1
          fi

      - name: Pusher vers origin (avec réessais)
        if: steps.create-commit.outputs.commit_created == 'true'
        id: push
        run: |
          echo "📤 Push vers origin/${{ github.ref_name }}..."
          
          git remote set-url origin https://${{ secrets.GITHUB_TOKEN }}@github.com/famibelle/horoscope-ia.git
          
          # Première tentative
          if git push origin ${{ github.ref_name }}; then
            echo "✅ Push réussi (1ère tentative)"
            echo "push_success=true" >> $GITHUB_OUTPUT
          else
            echo "⚠️  Première tentative échouée, réessai dans 10s..."
            sleep 10
            if git push origin ${{ github.ref_name }}; then
              echo "✅ Push réussi (2ème tentative)"
              echo "push_success=true" >> $GITHUB_OUTPUT
            else
              echo "❌ Push échoué après 2 tentatives !"
              echo "push_success=false" >> $GITHUB_OUTPUT
              exit 1
            fi
          fi

      - name: Vérifier le push sur remote
        if: steps.push.outputs.push_success == 'true'
        run: |
          echo "🔍 Vérification finale que les fichiers sont sur origin..."
          DATE=${{ steps.date.outputs.DATE }}
          
          # Attendre que GitHub indexe les changements
          sleep 15
          
          # Vérifier chaque fichier via l'API GitHub
          for file in "public/data/horoscopes/${DATE}.json" \
                      "public/data/ambiance/${DATE}.json" \
                      "public/data/signe-du-jour/${DATE}.json"; do
            if curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
                     "https://api.github.com/repos/famibelle/horoscope-ia/contents/${file}?ref=${{ github.ref_name }}" | \
                     grep -q "\"encoding\": \"base64\""; then
              echo "✅ $file est bien sur origin/${{ github.ref_name }}"
            else
              echo "❌ Fichier non trouvé sur remote: $file"
              exit 1
            fi
          done
          
          echo "✅ TOUS les fichiers sont confirmés sur remote !"

      # ========================================================================
      # 📊 COUCHE 9: ANALYSE DES LOGS (si la génération a eu lieu)
      # ========================================================================
      - name: Analyser les logs de génération
        if: always() && steps.generate-horoscopes.outputs.SUCCESS == 'true'
        run: |
          echo "📊 Analyse des logs..."
          LAST_LOG=$(ls -t logs/generation-report-*.md 2>/dev/null | head -1 || true)
          if [ -n "$LAST_LOG" ]; then
            echo "📄 Dernier rapport: $LAST_LOG"
            # Extraire le statut du rapport
            STATUS=$(grep -m 1 "Final Status:" "$LAST_LOG" | sed 's/.*Final Status: //' || echo "unknown")
            echo "Statut: $STATUS"
            
            # Compter les erreurs
            ERROR_COUNT=$(grep -c "❌" "$LAST_LOG" || echo "0")
            echo "Nombre d'erreurs dans les logs: $ERROR_COUNT"
            
            if [ "$ERROR_COUNT" -gt 0 ]; then
              echo "⚠️  Des erreurs ont été détectées dans les logs"
            fi
          fi

      # ========================================================================
      # 💾 COUCHE 10: UPLOAD DES ARTIFACTS (LOGS + DONNÉES)
      # ========================================================================
      - name: Upload generated data as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-data-${{ steps.date.outputs.DATE }}
          path: |
            public/data/
            logs/
          retention-days: 7
          compression-level: 0

      - name: Upload logs separately (30 jours de rétention)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generation-logs-${{ steps.date.outputs.DATE }}
          path: logs/
          retention-days: 30
          compression-level: 0


  # =============================================================================
  # 🛡️  JOB DE RÉCUPÉRATION ULTIME (Si tout échoue)
  # =============================================================================
  recovery:
    needs: generate
    if: always() && (needs.generate.result == 'failure' || needs.generate.outputs.SUCCESS != 'true')
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Télécharger les artefacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          merge-multiple: true

      - name: Extraire les logs et données
        run: |
          echo "🔍 Extraction des artefacts..."
          mkdir -p logs
          mkdir -p public/data/horoscopes
          mkdir -p public/data/ambiance
          mkdir -p public/data/signe-du-jour
          
          # Copier les logs
          find artifacts/ -name "generation-report-*.md" -exec cp {} logs/ \;
          
          # Copier les données générées
          find artifacts/ -name "*.json" -path "*/public/data/*" -exec cp --parents {} public/ \;
          
          ls -la logs/ || true
          ls -la public/data/ || true

      - name: Vérifier les fichiers récupérés
        id: check-recovered
        run: |
          echo "🔍 Vérification des fichiers récupérés..."
          DATE=$(date -u +%Y-%m-%d)
          FOUND=false
          
          # Chercher des fichiers JSON dans public/data
          if [ -n "$(find public/data/ -name "*.json" -type f 2>/dev/null)" ]; then
            FOUND=true
            echo "✅ Fichiers JSON trouvés dans public/data/"
          else
            # Chercher dans les artefacts directement
            if [ -n "$(find artifacts/ -name "*.json" -type f 2>/dev/null)" ]; then
              FOUND=true
              echo "✅ Fichiers JSON trouvés dans les artefacts"
              # Copier manuellement
              find artifacts/ -name "*.json" -type f -exec cp {} public/data/ \;
            fi
          fi
          
          if [ "$FOUND" = true ]; then
            echo "files_found=true" >> $GITHUB_OUTPUT
          else
            echo "files_found=false" >> $GITHUB_OUTPUT
            echo "❌ Aucun fichier JSON trouvé dans les artefacts"
          fi

      - name: Commit les fichiers récupérés
        if: steps.check-recovered.outputs.files_found == 'true'
        run: |
          echo "📝 Commit des fichiers récupérés..."
          
          git config --global user.name "GitHub Actions Recovery"
          git config --global user.email "recovery@github.com"
          
          DATE=$(date -u +%Y-%m-%d)
          git add public/data/ logs/
          
          if ! git diff --cached --quiet; then
            if git commit -m "chore: récupération automatique des données du ${DATE} [auto-recovered]"; then
              echo "✅ Commit de récupération créé"
              
              git remote set-url origin https://${{ secrets.GITHUB_TOKEN }}@github.com/famibelle/horoscope-ia.git
              
              if git push origin ${{ github.ref_name }}; then
                echo "✅ Push de récupération réussi !"
              else
                echo "⚠️  Échec du push de récupération"
                # Créer une issue pour alerter
                curl -s -X POST "https://api.github.com/repos/famibelle/horoscope-ia/issues" \
                  -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
                  -H "Content-Type: application/json" \
                  -d "{\"title\":\"⚠️  Récupération automatique partielle - ${DATE}\",\"body\":\"La récupération automatique a trouvé des fichiers mais n'a pas pu les pusher.\\n\\n**Workflow:** ${GITHUB_WORKFLOW}\\n**Run:** ${GITHUB_RUN_ID}\\n\\n[Voir le run](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})\",\"labels\":[\"recovery-partial\"]}"
              fi
            else
              echo "❌ Échec du commit de récupération"
            fi
          else
            echo "ℹ️  Aucun changement à commiter"
          fi

      - name: Créer une issue d'alerte (si aucune récupération possible)
        if: steps.check-recovered.outputs.files_found == 'false'
        run: |
          echo "🚨 AUCUNE RÉCUPÉRATION POSSIBLE"
          curl -s -X POST "https://api.github.com/repos/famibelle/horoscope-ia/issues" \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"title\":\"🚨 URGENT: Génération des horoscopes échouée - Coût: 25€ ?\",
              \"body\":\"**Workflow:** ${GITHUB_WORKFLOW}\\n**Run:** #${GITHUB_RUN_NUMBER}\\n**Date:** $(date -u +%Y-%m-%d)\\n\\n❌ **Aucun fichier généré n'a été trouvé** dans les artefacts.\\n\\n**Actions requises:**\\n1. Vérifiez les logs: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\\n2. Vérifiez que MISTRAL_API_KEY est valide\\n3. Vérifiez le quota Mistral\\n4. Relancez manuellement\\n\\n[Relancer](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/workflows/${GITHUB_WORKFLOW_ID})\\n[Voir les artefacts](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})\",
              \"labels\":[\"urgent\",\"cost-risk\",\"needs-attention\"]
            }"
