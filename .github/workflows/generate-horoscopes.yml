name: Générer les horoscopes et ambiances quotidiens

# Workflow fusionné - Génère automatiquement horoscopes, ambiances et signe du jour
# Sécurisé avec checks préventifs pour éviter le gaspillage d'appels Mistral

on:
  # Tous les jours à 4h00 UTC = minuit en Guadeloupe (UTC-4)
  # Cela permet d'avoir les horoscopes prêts pour la journée en Guadeloupe
  # et pour les visiteurs dans d'autres fuseaux horaires
  schedule:
    - cron: '0 4 * * *'  # 4h00 UTC = 00h00 Guadeloupe
  
  # Déclenchement manuel avec options
  workflow_dispatch:
    inputs:
      date:
        description: 'Date à générer (YYYY-MM-DD). Par défaut: demain en Guadeloupe'
        required: false
      mode:
        description: 'Mode de génération'
        required: false
        default: 'normal'
        type: choice
        options:
        - normal
        - verbose
        - force
        - force-verbose
  
  # Déclencher aussi lors d'un push sur main (pour les tests)
  push:
    branches: [main, vaudou]
    paths:
      - 'scripts/generate-horoscopes.ts'
      - 'scripts/generate-ambiances.ts'
      - 'scripts/generate-signe-du-jour.ts'
      - 'lib/private/maryse-prompt.ts'
      - 'lib/cultural-context.ts'
      - '.github/workflows/generate-horoscopes.yml'

jobs:
  generate:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Récupérer tout l'historique pour les tags
      
      # ========================================================================
      # 🛡️ ULTIMATE SAFETY CHECK - AVANT TOUS LES APPELS MISTRAL
      # ========================================================================
      
      - name: Ultimate safety check - Scan workflow for bare git push
        run: |
          echo "🔒 Ultimate Safety Check: Vérification du workflow..."
          
          # Chercher tous les 'git push' sans 'origin' dans ce workflow
          DANGEROUS_PUSHES=$(grep -n "^[[:space:]]*git push[[:space:]]*$" .github/workflows/generate-horoscopes.yml || true)
          
          if [ -n "$DANGEROUS_PUSHES" ]; then
            echo "❌ ERREUR CRITIQUE: Le workflow contient des 'git push' sans branche spécifiée !"
            echo "Les commandes problématiques:"
            echo "$DANGEROUS_PUSHES"
            echo ""
            echo "Utilisez 'git push origin HEAD' ou 'git push origin <branch>' à la place"
            echo ""
            echo "Cela éviterait de gaspiller ~24€ en appels Mistral !"
            exit 1
          else
            echo "✅ Aucun 'git push' dangereux détecté dans le workflow"
          fi
          
          # Vérifier aussi les autres fichiers de workflow
          echo "🔍 Scan des autres workflows..."
          ALL_WORKFLOWS=$(find .github/workflows -name "*.yml" -o -name "*.yaml" || true)
          for workflow in $ALL_WORKFLOWS; do
            if [ "$workflow" != ".github/workflows/generate-horoscopes.yml" ]; then
              DANGEROUS=$(grep -n "^[[:space:]]*git push[[:space:]]*$" "$workflow" || true)
              if [ -n "$DANGEROUS" ]; then
                echo "⚠️  Avertissement: $workflow contient des 'git push' non sécurisés:"
                echo "$DANGEROUS"
              fi
            fi
          done
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Verify branch exists on remote
        run: |
          if ! git ls-remote --heads origin ${{ github.ref_name }} | grep -q "refs/heads/${{ github.ref_name }}"; then
            echo "⚠️  Branche ${{ github.ref_name }} n'existe pas sur origin"
            echo "Création de la branche..."
            git push https://x-access-token:${{ secrets.PUSH_TOKEN }}@github.com/famibelle/horoscope-ia.git HEAD:${{ github.ref_name }}
          else
            echo "✅ Branche ${{ github.ref_name }} existe sur origin"
          fi
      
      # ========================================================================
      # 📅 CONFIGURATION DE LA DATE
      # ========================================================================
      
      - name: Configure date for generation
        id: date
        run: |
          # Si une date est fournie via workflow_dispatch, l'utiliser
          if [ -n "${{ github.event.inputs.date }}" ]; then
            echo "DATE=${{ github.event.inputs.date }}" >> $GITHUB_OUTPUT
          else
            # Sinon, utiliser la date de demain en Guadeloupe (UTC-4)
            # Cela permet d'avoir les horoscopes prêts pour le lendemain
            TOMORROW_GUADELOUPE=$(date -u -d '+4 hours' +%Y-%m-%d)
            echo "DATE=$TOMORROW_GUADELOUPE" >> $GITHUB_OUTPUT
            echo "Génération pour demain (Guadeloupe): $TOMORROW_GUADELOUPE"
          fi
      
      # ========================================================================
      # 🚀 GÉNÉRATION DES DONNÉES
      # ========================================================================
      
      - name: Générer les horoscopes
        id: generate
        run: |
          echo "🚀 Démarrage de la génération pour ${{ steps.date.outputs.DATE }}"
          
          # Construire la commande avec les arguments de mode
          COMMAND="npx tsx scripts/generate-horoscopes.ts --date=${{ steps.date.outputs.DATE }} --force"
          
          # Ajouter les flags selon le mode
          case "${{ github.event.inputs.mode }}" in
            verbose)
              COMMAND="$COMMAND --verbose"
              ;;
            force-verbose)
              COMMAND="$COMMAND --verbose"
              ;;
          esac
          
          # Ajouter --verbose si c'est un workflow manuel sans mode spécifié
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.mode }}" = "normal" ]; then
            COMMAND="$COMMAND --verbose"
          fi
          
          echo "Commande: $COMMAND"
          
          # Exécuter
          if $COMMAND; then
            echo "SUCCESS=true" >> $GITHUB_OUTPUT
            echo "✅ Génération horoscopes terminée avec succès!"
          else
            echo "SUCCESS=false" >> $GITHUB_OUTPUT
            echo "❌ Échec de la génération"
            exit 1
          fi
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          NETLIFY_URL: https://horoscope-karukera.netlify.app
          NODE_ENV: production
      
      - name: Générer les ambiances
        id: generate-ambiance
        run: |
          echo "🎨 Génération des ambiances pour ${{ steps.date.outputs.DATE }}"
          
          # Construire la commande
          AMB_COMMAND="npx tsx scripts/generate-ambiances.ts --date=${{ steps.date.outputs.DATE }} --force"
          
          # Ajouter les flags selon le mode
          case "${{ github.event.inputs.mode }}" in
            verbose)
              AMB_COMMAND="$AMB_COMMAND --verbose"
              ;;
            force-verbose)
              AMB_COMMAND="$AMB_COMMAND --verbose"
              ;;
          esac
          
          echo "Commande: $AMB_COMMAND"
          
          # Exécuter
          if $AMB_COMMAND; then
            echo "AMB_SUCCESS=true" >> $GITHUB_OUTPUT
            echo "✅ Génération ambiances terminée avec succès!"
          else
            echo "AMB_SUCCESS=false" >> $GITHUB_OUTPUT
            echo "⚠️  Échec de la génération ambiances (non bloquant)"
          fi
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          NETLIFY_URL: https://horoscope-karukera.netlify.app
          NODE_ENV: production
      
      - name: Générer le signe du jour
        id: generate-signe
        run: |
          echo "🌿 Génération du signe du jour pour ${{ steps.date.outputs.DATE }}"
          
          # Construire la commande
          SDJ_COMMAND="npx tsx scripts/generate-signe-du-jour.ts --date=${{ steps.date.outputs.DATE }} --force"
          
          # Ajouter les flags selon le mode
          case "${{ github.event.inputs.mode }}" in
            verbose)
              SDJ_COMMAND="$SDJ_COMMAND --verbose"
              ;;
            force-verbose)
              SDJ_COMMAND="$SDJ_COMMAND --verbose"
              ;;
          esac
          
          echo "Commande: $SDJ_COMMAND"
          
          # Exécuter
          if $SDJ_COMMAND; then
            echo "SDJ_SUCCESS=true" >> $GITHUB_OUTPUT
            echo "✅ Génération signe du jour terminée avec succès!"
          else
            echo "SDJ_SUCCESS=false" >> $GITHUB_OUTPUT
            echo "⚠️  Échec de la génération signe du jour (non bloquant)"
          fi
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          NETLIFY_URL: https://horoscope-karukera.netlify.app
          NODE_ENV: production
      
      # ========================================================================
      # 📝 COMMIT ET PUSH DES DONNÉES GÉNÉRÉES
      # ========================================================================
      
      - name: Commit and push changes
        if: steps.generate.outputs.SUCCESS == 'true'
        run: |
          echo "📝 Commit des fichiers générés"
          
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          
          # Vérifier s'il y a des changements
          if [ -n "$(git status --porcelain)" ]; then
            DATE=${{ steps.date.outputs.DATE }}
            
            # Ajouter les fichiers générés
            git add public/data/horoscopes/${DATE}.json
            
            # Ajouter les ambiances si générées avec succès
            if [ "${{ steps.generate-ambiance.outputs.AMB_SUCCESS }}" = "true" ] || [ -f "public/data/ambiance/${DATE}.json" ]; then
              git add public/data/ambiance/${DATE}.json
            fi
            
            # Ajouter le signe du jour si généré avec succès
            if [ "${{ steps.generate-signe.outputs.SDJ_SUCCESS }}" = "true" ] || [ -f "public/data/signe-du-jour/${DATE}.json" ]; then
              git add public/data/signe-du-jour/${DATE}.json
            fi
            
            # Vérifier si le fichier existe bien
            if git diff --cached --quiet; then
              echo "Aucun changement à commiter"
            else
              git commit -m "chore: horoscopes, ambiances et signe du jour du ${DATE} [auto-generated]"
              git push https://x-access-token:${{ secrets.PUSH_TOKEN }}@github.com/famibelle/horoscope-ia.git HEAD:vaudou
              echo "✅ Commit et push effectués sur ${{ github.ref_name }}"
            fi
          else
            echo "Aucun fichier à commiter"
          fi
      
      # ========================================================================
      # 🔍 VÉRIFICATION DES DONNÉES GÉNÉRÉES
      # ========================================================================
      
      - name: Vérification des fichiers générés
        if: steps.generate.outputs.SUCCESS == 'true'
        run: |
          echo "🔍 Vérification des fichiers générés"
          
          DATE=${{ steps.date.outputs.DATE }}
          
          # Vérifier les horoscopes
          HORO_FILE="public/data/horoscopes/${DATE}.json"
          if [ -f "$HORO_FILE" ]; then
            COUNT=$(jq '. | length' "$HORO_FILE")
            echo "✅ Fichier horoscopes trouvé: $HORO_FILE ($COUNT entrées)"
            
            # Vérifier qu'on a bien 48 entrées (12 signes × 4 éditions)
            if [ "$COUNT" -eq 48 ]; then
              echo "✅ Nombre d'entrées correct: 48"
            else
              echo "⚠️  Nombre d'entrées inattendu: $COUNT (attendu: 48)"
            fi
          else
            echo "❌ Fichier horoscopes non trouvé: $HORO_FILE"
            exit 1
          fi
          
          # Vérifier les ambiances (optionnel)
          AMB_FILE="public/data/ambiance/${DATE}.json"
          if [ -f "$AMB_FILE" ]; then
            AMB_COUNT=$(jq '. | length' "$AMB_FILE")
            echo "✅ Fichier ambiances trouvé: $AMB_FILE ($AMB_COUNT entrées)"
          else
            echo "ℹ️  Fichier ambiances non généré (optionnel)"
          fi
          
          # Vérifier le signe du jour (optionnel)
          SDJ_FILE="public/data/signe-du-jour/${DATE}.json"
          if [ -f "$SDJ_FILE" ]; then
            echo "✅ Fichier signe du jour trouvé: $SDJ_FILE"
          else
            echo "ℹ️  Fichier signe du jour non généré (optionnel)"
          fi
      
      # ========================================================================
      # 🔒 VÉRIFICATION DE SÉCURITÉ DES CONTENUS
      # ========================================================================
      
      - name: Vérification des garde-fous
        if: steps.generate.outputs.SUCCESS == 'true'
        run: |
          echo "🔒 Vérification des garde-fous..."
          DATE=${{ steps.date.outputs.DATE }}
          DANGEROUS_PATTERNS=(
            "allume.*bougie"
            "brûle.*encens"
            "mange.*plante"
            "bois.*rhum"
            "prends.*couteau"
            "sacrifie.*animal"
            "soigne.*toi"
          )
          HORO_FILE="public/data/horoscopes/${DATE}.json"
          if [ -f "$HORO_FILE" ]; then
            FOUND=false
            for pattern in "${DANGEROUS_PATTERNS[@]}"; do
              if grep -i -E "$pattern" "$HORO_FILE"; then
                echo "❌ Pattern dangereux: $pattern"
                FOUND=true
              fi
            done
            if [ "$FOUND" = false ]; then
              echo "✅ Aucun contenu dangereux détecté"
            else
              echo "❌ Contenu dangereux détecté!"
              exit 1
            fi
          fi
      
      # ========================================================================
      # 💾 UPLOAD ARTIFACTS POUR RÉCUPÉRATION EN CAS D'ÉCHEC
      # ========================================================================
      - name: Upload generated data as artifact
        if: always()  # Upload même si la vérification échoue
        uses: actions/upload-artifact@v4
        with:
          name: generated-data-${{ steps.date.outputs.DATE }}
          path: public/data/
          retention-days: 7
          compression-level: 0  # Pas de compression pour accès rapide

  # Job supplémentaire pour vérifier le déploiement
  verify:
    needs: generate
    if: always() && needs.generate.outputs.SUCCESS == 'true'
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run verification script
        run: node scripts/verify-deployment.mjs
        env:
          NETLIFY_URL: https://horoscope-karukera.netlify.app

  # Job pour nettoyer les anciens fichiers (optionnel)
  cleanup:
    needs: verify
    if: success()
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Remove old horoscope files
        run: |
          echo "🧹 Nettoyage des anciens fichiers d'horoscopes"
          
          # Garder seulement les fichiers des 7 derniers jours
          find public/data/horoscopes/ -name "*.json" -type f | while read file; do
            filename=$(basename "$file" .json)
            
            # Convertir le nom de fichier en date
            if [[ "$filename" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
              filedate="$filename"
              
              # Calculer l'âge en jours
              age=$(( ($(date +%s) - $(date -d "$filedate" +%s)) / 86400 ))
              
              # Supprimer si plus vieux que 7 jours
              if [ "$age" -gt 7 ]; then
                echo "Suppression: $file ($age jours)"
                git rm "$file" 2>/dev/null || rm "$file"
              fi
            fi
          done
          
          # Commit le nettoyage
          if [ -n "$(git status --porcelain)" ]; then
            git config --global user.name "GitHub Actions"
            git config --global user.email "actions@github.com"
            git add -A
            git commit -m "chore: nettoyage des anciens horoscopes [auto]"
            git push https://x-access-token:${{ secrets.PUSH_TOKEN }}@github.com/famibelle/horoscope-ia.git HEAD
          fi

  # ========================================================================
  # 🛡️ JOB DE RÉCUPÉRATION AUTOMATIQUE
  # S'exécute si la génération a réussi mais le push a échoué
  # ========================================================================
  recovery:
    needs: generate
    if: failure() && needs.generate.result == 'success'
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PUSH_TOKEN }}
      
      - name: Download generated data artifact
        uses: actions/download-artifact@v4
        with:
          name: generated-data-${{ needs.generate.outputs.DATE }}
          path: public/data/
      
      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
      
      - name: Verify files exist
        id: verify-files
        run: |
          DATE=${{ needs.generate.outputs.DATE }}
          if [ -f "public/data/horoscopes/${DATE}.json" ] || \
             [ -f "public/data/ambiance/${DATE}.json" ] || \
             [ -f "public/data/signe-du-jour/${DATE}.json" ]; then
            echo "files_exist=true" >> $GITHUB_OUTPUT
            echo "✅ Fichiers artefacts trouvés"
          else
            echo "files_exist=false" >> $GITHUB_OUTPUT
            echo "❌ Aucun fichier artefact trouvé"
            exit 1
          fi
      
      - name: Commit and push recovered data
        if: steps.verify-files.outputs.files_exist == 'true'
        run: |
          DATE=${{ needs.generate.outputs.DATE }}
          
          git add public/data/horoscopes/${DATE}.json public/data/ambiance/${DATE}.json public/data/signe-du-jour/${DATE}.json
          
          if git diff --cached --quiet; then
            echo "Aucun changement à commiter"
          else
            git commit -m "chore: récupération des données du ${DATE} [auto-recovered]"
            git push https://x-access-token:${{ secrets.PUSH_TOKEN }}@github.com/famibelle/horoscope-ia.git HEAD
            echo "✅ Récupération et push réussis !"
          fi
