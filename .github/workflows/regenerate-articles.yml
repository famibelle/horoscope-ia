name: Régénérer les articles mensuels

on:
  schedule:
    - cron: '0 4 1 * *'   # 1er du mois à 4h UTC (minuit Guadeloupe)
  workflow_dispatch:
    inputs:
      mode:
        description: 'Mode de génération'
        required: false
        default: 'normal'
        type: choice
        options:
        - normal
        - verbose
        - force
        - force-verbose

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  regenerate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Configurer SSH pour le sous-module privé
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SUBMODULE_DEPLOY_KEY }}

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Régénérer les articles via Mistral
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: |
          ARGS=""
          case "${{ inputs.mode }}" in
            verbose)   ARGS="--verbose" ;;
            force)     ARGS="--force" ;;
            force-verbose) ARGS="--force --verbose" ;;
          esac
          npx tsx private/generate-articles.ts $ARGS

      - name: Commit et push si des articles ont changé
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git checkout main
          git fetch origin
          git reset --hard origin/main
          git add lib/articles-content.json
          git diff --staged --quiet || git commit -m "chore: régénération mensuelle des articles ($(date +%Y-%m)) [skip netlify]"
          git push --force-with-lease origin main
