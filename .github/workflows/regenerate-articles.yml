name: Régénérer les articles mensuels

on:
  # Désactivé : régénération automatique risquait de réintroduire des citations
  # inventées / faits erronés déjà corrigés manuellement dans articles-content.json.
  # Réactiver seulement après avoir ajouté des garde-fous au prompt de génération.
  # schedule:
  #   - cron: '0 4 1 * *'   # 1er du mois à 4h UTC (minuit Guadeloupe)
  workflow_dispatch:
    inputs:
      mode:
        description: 'Mode de génération'
        required: false
        default: 'normal'
        type: choice
        options:
        - normal
        - verbose
        - force
        - force-verbose
      confirm:
        description: 'Tapez exactement JE CONFIRME pour lancer (protection contre un clic accidentel)'
        required: true
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  regenerate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Vérifier la confirmation explicite
        run: |
          if [ "${{ inputs.confirm }}" != "JE CONFIRME" ]; then
            echo "::error::Confirmation manquante ou incorrecte. lib/private/generate-articles.ts régénère du contenu et pourrait affecter les articles ; le champ 'confirm' doit contenir exactement JE CONFIRME pour continuer. Notez par ailleurs que le script protège déjà de son côté tout article portant un champ 'sources' (contenu réécrit à la main) : il ne sera pas régénéré sauf --overwrite-sourced explicite."
            exit 1
          fi

      - name: Configurer SSH pour le sous-module privé
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SUBMODULE_DEPLOY_KEY }}

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Régénérer les articles via Mistral
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: |
          ARGS=""
          case "${{ inputs.mode }}" in
            verbose)   ARGS="--verbose" ;;
            force)     ARGS="--force" ;;
            force-verbose) ARGS="--force --verbose" ;;
          esac
          npx tsx private/generate-articles.ts $ARGS

      - name: Commit et push si des articles ont changé
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git checkout main
          git fetch origin
          git reset --hard origin/main
          git add lib/articles-content.json
          git diff --staged --quiet || git commit -m "chore: régénération mensuelle des articles ($(date +%Y-%m)) [skip netlify]"
          git push --force-with-lease origin main
