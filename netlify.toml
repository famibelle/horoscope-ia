# Configuration Netlify pour Horoscope Karukera
# Utilise Next.js 15 avec le plugin officiel @netlify/plugin-nextjs

[build]
  # Commande de build : GitHub Actions génère déjà les fichiers
  # Le prebuild est désactivé car les fichiers sont générés par GitHub Actions
  command = "next build"
  
  # Dossier à déployer (généré par Next.js)
  publish = ".next"
  
  # Fonctions serverless (Next.js API routes)
  functions = ".next"

# Configuration du processing
[build.processing]
  skip_processing = false

# Variables d'environnement par défaut
[build.environment]
  NODE_VERSION = "20"
  
  # Activation des fonctionnalités de génération
  ENABLE_ON_DEMAND_GENERATION = "true"
  ENABLE_BACKGROUND_GENERATION = "true"
  
  # Désactiver le prebuild en production (GitHub Actions génère déjà les fichiers)
  SKIP_PREBUILD = "true"
  
  # URL de base pour le fetch des fichiers
  NETLIFY_URL = "https://horoscope-karukera.netlify.app"

# ============================================================
# PLUGINS
# ============================================================

# Plugin Next.js officiel pour Netlify
# Version 5.15.11 compatible avec Next.js 15
[[plugins]]
  package = "@netlify/plugin-nextjs"

# ============================================================
# HEADERS : Configuration du cache
# ============================================================

# Désactiver le cache pour les fichiers d'horoscopes
[[headers]]
  for = "/data/horoscopes/*.json"
  [headers.values]
    Cache-Control = "no-store, max-age=0, must-revalidate"
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, OPTIONS"

# Désactiver le cache pour les fichiers de signe-du-jour
[[headers]]
  for = "/data/signe-du-jour/*.json"
  [headers.values]
    Cache-Control = "no-store, max-age=0, must-revalidate"
    Access-Control-Allow-Origin = "*"

# Désactiver le cache pour les fichiers d'ambiance
[[headers]]
  for = "/data/ambiance/*.json"
  [headers.values]
    Cache-Control = "no-store, max-age=0, must-revalidate"
    Access-Control-Allow-Origin = "*"

# Cache normal pour les autres assets statiques
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ============================================================
# REDIRECTS
# ============================================================

# Rediriger /health vers l'endpoint de santé
[[redirects]]
  from = "/health"
  to = "/api/horoscope/health"
  status = 307
  force = false

[[redirects]]
  from = "/health/*"
  to = "/api/horoscope/health/:splat"
  status = 307
  force = false

# ============================================================
# CONTEXTES DE DÉPLOIEMENT
# ============================================================

[context.production]
  command = "next build"
  [context.production.environment]
    NODE_ENV = "production"
    ENABLE_ON_DEMAND_GENERATION = "true"
    ENABLE_BACKGROUND_GENERATION = "true"
    SKIP_PREBUILD = "true"

[context.deploy-preview]
  command = "next build"
  [context.deploy-preview.environment]
    NODE_ENV = "production"
    ENABLE_ON_DEMAND_GENERATION = "true"
    ENABLE_BACKGROUND_GENERATION = "false"
    SKIP_PREBUILD = "true"

[context.branch-deploy]
  command = "next build"
  [context.branch-deploy.environment]
    NODE_ENV = "production"
    ENABLE_ON_DEMAND_GENERATION = "false"
    ENABLE_BACKGROUND_GENERATION = "false"
    SKIP_PREBUILD = "true"
